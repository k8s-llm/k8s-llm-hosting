apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model
  namespace: traefik
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: model-gateway-traefik
    namespace: traefik
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: model-nemotron-3-nano-4b
      namespace: models
      port: 11434
      weight: 1
    matches:
    - headers:
      - name: X-Forwarded-Host
        type: RegularExpression
        value: llm-nemotron-3-nano-4b.models.svc.cluster.local(:.*)?
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: model
  namespace: default
spec:
  to:
    - group: ""
      kind: Service
      name: model-model-nemotron-3-nano-4b
---
apiVersion: llmmodel.host-llm.io/v1alpha1
kind: Model
metadata:
  labels:
    app.kubernetes.io/name: model-model-nemotron-3-nano-4b
  name: model
  namespace: default
spec:
  provider: Ollama
  llmModel:
    name: nemotron-3-nano
    version: 4b
  maxReplicas: 1
  minReplicas: 1
  targetNamespace: models
  persistentVolumeClaimRef: models-pvc
  mountPath: /data/models
  modelPath: ollama/model-nemotron-3-nano-4b
---
