apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model
  namespace: traefik
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: model-gateway-traefik
    namespace: traefik
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: model
      namespace: default
      port: 11434
      weight: 1
    matches:
    - headers:
      - name: hostname
        type: Exact
        value: llm-qwen3-06b.traefik.svc.cluster.local
---
apiVersion: llmmodel.host-llm.io/v1alpha1
kind: Model
metadata:
  labels:
    app.kubernetes.io/name: model-qwen3-06b
  name: model
  namespace: default
spec:
  provider: Ollama
  llmModel:
    name: qwen3
    version: 0.6b
  maxReplicas: 1
  minReplicas: 1
  targetNamespace: models
  persistentVolumeClaimRef: models-pvc
  mountPath: /data/models
  modelPath: ollama/qwen3-0.6b
---
