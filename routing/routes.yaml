apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen3
  namespace: traefik
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: weight-gateway
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: ollama-qwen3-ro
      namespace: default
      port: 11434
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
    - headers:
      - name: X-Model
        value: qwen3
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: qwen3-grant
  namespace: default
  labels:
    model: qwen3 
spec:
  from: 
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: traefik
  to:
    - group: ""
      kind: Service
      name: ollama-qwen3-ro
---
